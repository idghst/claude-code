# 스펙 8.7 공급망 보안: 매 빌드마다 린트·타입·번들 크기·취약점 검사, SBOM 보관.
# 액션은 커밋 sha로 고정한다. Dependabot(github-actions)이 갱신 PR을 연다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - run: npm run size
      - run: npm audit --audit-level=high
      # node_modules에 SvelteKit 생성 폴더($app)가 있어 lockfile 기준으로 만든다.
      - run: npm sbom --sbom-format=cyclonedx --package-lock-only > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  osv-scanner:
    # Google 공식 재사용 워크플로. 취약점이 있으면 실패한다.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --lockfile=package-lock.json
      # Security 탭 업로드는 공개 저장소나 GitHub Advanced Security가 있을 때만 된다. 쓸 수 있으면 true로 바꾼다.
      upload-sarif: false
